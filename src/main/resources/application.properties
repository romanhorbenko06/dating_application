spring.application.name=dating_application
spring.datasource.url=jdbc:postgresql://localhost:5432/dating_application
spring.datasource.username=postgres
# Пароль до БД — лише зі змінної оточення, свідомо без значення за замовчуванням,
# щоб секрет не лежав у репозиторії. Якщо змінну не задано, Spring лишає плейсхолдер
# як є (Binder не падає на нерозвʼязаних плейсхолдерах) і зʼєднання обірве вже сам
# Postgres — усюди, крім машин, де для localhost налаштовано trust-автентифікацію.
spring.datasource.password=${DB_PASSWORD}

# update, а не create-drop: дані переживають перезапуск застосунку.
# Hibernate ДОдає нові таблиці й колонки, але сам нічого не видаляє й не звужує —
# перейменування поля чи зміну типу треба застосовувати до БД вручну.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ключ підпису JWT — БЕЗ значення за замовчуванням, свідомо.
# Дефолт у репозиторії = будь-хто, хто бачив код, підпише токен від імені
# будь-якого користувача. Не задано — застосунок падає на старті з поясненням.
# Згенерувати:  openssl rand -base64 32
jwt.secret=${JWT_SECRET:}
# 7 днів. Була 1 година, і без refresh-токена це означало примусовий
# перелогін щогодини — на фронті відчувається одразу. Повноцінна пара
# access+refresh лишається кращим рішенням, але для цього застосунку
# довший строк дає той самий ефект без окремого потоку оновлення.
# Компроміс усвідомлений: викрадений токен діє довше, проте logout (FR-5)
# гасить його точково через чорний список jti.
jwt.expiration=${JWT_EXPIRATION:604800000}

# Обліковий запис адміністратора, що створюється при старті, якщо його ще немає.
# Пароль без дефолта: не задано — адмін не створюється (див. AdminInitializer).
# Email не секрет, тож у нього дефолт лишається.
admin.email=${ADMIN_EMAIL:admin@datingapp.com}
admin.password=${ADMIN_PASSWORD:}

# Захист від перебору: скільки НЕВДАЛИХ спроб дозволено у вікні.
# На акаунт — головний бар'єр: підбір пароля чи 6-значного коду конкретному користувачу.
# На IP — проти розпилення (по одній спробі на багато акаунтів). Тримаємо помітно вищим:
# за NAT один IP ділять десятки людей, і надто жорсткий ліміт замкне невинних.
app.ratelimit.window-minutes=15
app.ratelimit.login.max-per-email=5
app.ratelimit.login.max-per-ip=30
app.ratelimit.verify.max-per-email=5
app.ratelimit.verify.max-per-ip=30
# Реєстрація: ліміт не проти перебору, а проти спам-розсилки — кожен успішний
# запит шле лист із нашого ящика. Тому рахуються ВСІ спроби, а не лише невдалі.
#
# 5 на адресу за 15 хв = сама реєстрація плюс ЧОТИРИ повторні надсилання.
# Було 3, тобто лише дві спроби «код не дійшов» — на живій пошті цього замало:
# лист від нового відправника нерідко йде в спам, і людина тисне «надіслати ще раз»
# кілька разів, перш ніж здогадається туди зазирнути.
# На IP тримаємо 20: за одним NAT (гуртожиток, аудиторія на захисті) сидить
# багато людей, і 10 замикало б сусідів після двох-трьох реєстрацій.
app.ratelimit.register.max-per-email=5
app.ratelimit.register.max-per-ip=20

# Пошта. За замовчуванням ВИМКНЕНА: код підтвердження друкується в консоль,
# і застосунок повністю робочий без жодних SMTP-налаштувань.
# Щоб слати реальні листи — увімкнути тут і задати логін/пароль
# в application-local.properties (він у .gitignore).
# УВАГА: spring.mail.password — це App Password Google (16 символів),
# а НЕ пароль від акаунта. Він доступний лише при увімкненому 2FA.
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Адреса фронта — на неї веде кнопка в листі з кодом підтвердження.
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

# CORS: звідки браузеру дозволено звертатися до API. Через кому, без пробілів.
# Дефолт — dev-сервер Angular. Прод-домен додається змінною оточення:
#   APP_CORS_ALLOWED_ORIGINS=https://myapp.com
# Свідомо не "*": у застосунку особисті дані, список має бути явним.
# Той самий список використовує WebSocketConfig для рукостискання /ws.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Пул для @Scheduled. За замовчуванням 1 потік, а тепер там і ping по WebSocket
# (кожні 25 с, із мережевим записом): повільний клієнт не повинен затримувати
# чистку чорного списку токенів і лічильників rate-limit.
spring.task.scheduling.pool.size=2

application-description=Dating Application API
application-version=1.0.0

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Фотографії: тека сховища (створюється при старті поруч із jar) і ліміти
app.photos.dir=${PHOTOS_DIR:photos}
app.photos.max-per-user=6
# Обробка зображень: довша сторона обрізається до max-dimension, метадані зрізаються завжди
app.photos.max-dimension=1080
app.photos.jpeg-quality=0.85
app.photos.max-pixels=50000000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

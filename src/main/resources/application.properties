spring.application.name=dating_application
spring.datasource.url=jdbc:postgresql://localhost:5432/dating_application
spring.datasource.username=postgres
spring.datasource.password=asdqwe123+

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:U3VwZXJTZWNyZXRLZXlGb3JEYXRpbmdBcHAxMjM0NTY=}
jwt.expiration=3600000

# Обліковий запис адміністратора, що створюється при старті, якщо його ще немає
admin.email=${ADMIN_EMAIL:admin@datingapp.com}
admin.password=${ADMIN_PASSWORD:admin12345}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

application-description=Dating Application API
application-version=1.0.0

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Фотографії: тека сховища (створюється при старті поруч із jar) і ліміти
app.photos.dir=${PHOTOS_DIR:photos}
app.photos.max-per-user=6
# Обробка зображень: довша сторона обрізається до max-dimension, метадані зрізаються завжди
app.photos.max-dimension=1080
app.photos.jpeg-quality=0.85
app.photos.max-pixels=50000000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

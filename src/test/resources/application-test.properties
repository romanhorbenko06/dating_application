# ─────────────────────────────────────────────────────────────────────────────
# Профіль для автотестів. Активується анотацією @ActiveProfiles("test").
#
# ОКРЕМА база (dating_application_test), а не робоча: тут ddl-auto=create-drop,
# тобто схема створюється на старті й зноситься наприкінці. Направити це на
# dating_application означало б стерти дані розробки під час прогону тестів.
# ─────────────────────────────────────────────────────────────────────────────

spring.datasource.url=jdbc:postgresql://localhost:5432/dating_application_test
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}

# Схема під тести будується з нуля щоразу: тести не мають залежати від того,
# що лишилось у базі від попереднього прогону.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Ключ фіксований і несекретний — він існує лише в тестах.
# У проді порожній jwt.secret валить застосунок на старті, і саме через це
# `mvn test` падав до появи цього файлу: контекст не міг створити JwtUtil.
jwt.secret=dGVzdC1vbmx5LXNlY3JldC1ub3QtdXNlZC1pbi1wcm9kdWN0aW9uLTEyMw==
jwt.expiration=3600000

# Пошта вимкнена: тести не мають нікому нічого слати.
app.mail.enabled=false

# Адмін не створюється: порожній пароль → AdminInitializer пропускає крок.
# Тести, яким потрібен адмін, створюють його самі й контрольовано.
admin.password=

# Ліміти залишаємо як у проді — саме їх і перевіряємо.
app.photos.dir=${java.io.tmpdir}/znaidy-test-photos

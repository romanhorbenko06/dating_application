spring.application.name=dating_application
spring.datasource.url=jdbc:postgresql://localhost:5432/dating_application
spring.datasource.username=postgres
# Пароль до БД лише зі змінної оточення.
spring.datasource.password=${DB_PASSWORD}

# Hibernate лише додає таблиці й колонки; перейменування й зміну типу робити вручну.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Без значення за замовчуванням. Згенерувати: openssl rand -base64 32
jwt.secret=${JWT_SECRET:}
# 7 днів; logout гасить токен точково через чорний список jti.
jwt.expiration=${JWT_EXPIRATION:604800000}

# Без пароля адмін не створюється (див. AdminInitializer).
admin.email=${ADMIN_EMAIL:admin@datingapp.com}
admin.password=${ADMIN_PASSWORD:}

# Ліміт невдалих спроб: на акаунт проти підбору, на IP вищий через NAT.
app.ratelimit.window-minutes=15
app.ratelimit.login.max-per-email=5
app.ratelimit.login.max-per-ip=30
app.ratelimit.verify.max-per-email=5
app.ratelimit.verify.max-per-ip=30
# Реєстрація: рахуються всі спроби, бо кожна шле лист.
app.ratelimit.register.max-per-email=5
app.ratelimit.register.max-per-ip=20

# Пошта за замовчуванням вимкнена: код друкується в консоль.
# Логін і App Password Google задаються в application-local.properties.
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

# Дозволені origin'и через кому; цей самий список використовує WebSocketConfig.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Пул для @Scheduled: ping по WebSocket не має затримувати чистку.
spring.task.scheduling.pool.size=2

application-description=Dating Application API
application-version=1.0.0

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

app.photos.dir=${PHOTOS_DIR:photos}
app.photos.max-per-user=6
app.photos.max-dimension=1080
app.photos.jpeg-quality=0.85
app.photos.max-pixels=50000000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# «Острів на двох»: дедлайни фаз у годинах.
app.island.invite-ttl-hours=48
app.island.phase-ttl-hours=72
